<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Админка бронирований</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: #1f2937;
      --accent: #22c55e;
      --danger: #ef4444;
      --secondary: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button, select {
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 12px 14px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: #062b14;
      font-weight: 700;
      border: none;
    }

    button.secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error, .info {
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: none;
      white-space: pre-line;
    }

    .error {
      background: rgba(239,68,68,.15);
      color: #fecaca;
      border: 1px solid rgba(239,68,68,.35);
    }

    .info {
      background: rgba(34,197,94,.12);
      color: #dcfce7;
      border: 1px solid rgba(34,197,94,.3);
    }

    .stats {
      margin-bottom: 12px;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: #0f172a;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px 14px;
      margin: 12px 0;
    }

    .meta div {
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 720px) {
      .meta {
        grid-template-columns: 1fr;
      }

      .card-head {
        flex-direction: column;
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar > * {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="title">🛠 Текущие брони</div>
        <div class="muted">Ручная отмена активных подтверждённых броней</div>
      </div>
      <button id="refreshBtn" class="secondary">Обновить</button>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="infoBox" class="info"></div>

    <div class="toolbar">
      <select id="limitSelect">
        <option value="20">20 записей</option>
        <option value="50">50 записей</option>
        <option value="100">100 записей</option>
      </select>
    </div>

    <div id="stats" class="stats muted">Загрузка…</div>
    <div id="list" class="list"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const $ = (id) => document.getElementById(id);
    let currentItems = [];

    function showBox(id, message = "") {
      const el = $(id);
      if (!message) {
        el.style.display = "none";
        el.textContent = "";
        return;
      }
      el.style.display = "block";
      el.textContent = message;
    }

    function showError(message = "") {
      showBox("errorBox", message);
    }

    function showInfo(message = "") {
      showBox("infoBox", message);
    }

    function tgHeaders() {
      return {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": tg?.initData || "",
      };
    }

    async function api(path, payload) {
      const res = await fetch(path, {
        method: "POST",
        headers: tgHeaders(),
        body: JSON.stringify(payload),
      });

      const text = await res.text();
      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { detail: text || `HTTP ${res.status}` };
      }

      if (!res.ok) {
        throw new Error(data.detail || text || `HTTP ${res.status}`);
      }

      return data;
    }

    function statusLabel(status) {
      const map = {
        CONFIRMED: "Подтверждена",
        CANCELLED: "Отменена",
      };
      return map[status] || status;
    }

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function renderItems(items) {
      const box = $("list");
      box.innerHTML = "";

      if (!items.length) {
        box.innerHTML = `<div class="card"><div class="muted">Сейчас активных подтверждённых броней нет.</div></div>`;
        return;
      }

      for (const item of items) {
        const guestLabel = item.telegram_username
          ? `@${esc(item.telegram_username.replace(/^@/, ""))}`
          : esc(item.telegram_name || "Гость");

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-head">
            <div>
              <div><strong>#${item.booking_id}</strong> • ${esc(item.unit_title)}</div>
              <div class="muted">${esc(item.check_in)} → ${esc(item.check_out)} • ${item.nights} ноч.</div>
            </div>
            <div class="badge">${esc(statusLabel(item.status))}</div>
          </div>

          <div class="meta">
            <div><strong>Гость</strong><br>${guestLabel}</div>
            <div><strong>Телефон</strong><br><span class="mono">${esc(item.phone)}</span></div>
            <div><strong>Тариф</strong><br>${esc(item.tariff_title)}</div>
            <div><strong>Гости</strong><br>${item.adults} взр. • ${item.children} дет. • доп. мест: ${item.extra_bed_count}</div>
            <div><strong>Сумма</strong><br>${item.total_amount} ₽ • предоплата ${item.prepay_amount} ₽</div>
            <div><strong>Подтверждена</strong><br>${esc(item.confirmed_at || "-")}</div>
          </div>

          <div class="actions">
            <button data-action="cancel" data-id="${item.booking_id}" class="danger">🗑 Отменить бронь</button>
          </div>
        `;
        box.appendChild(card);
      }
    }

    async function loadList() {
      showError("");
      showInfo("");

      const limit = Number($("limitSelect").value || 20);
      const data = await api("/api/v2/admin/webapp/bookings/list", { limit });

      currentItems = Array.isArray(data.items) ? data.items : [];
      $("stats").textContent = `Найдено активных броней: ${data.count ?? currentItems.length}`;
      renderItems(currentItems);
    }

    async function doCancel(bookingId) {
      const item = currentItems.find(x => x.booking_id === bookingId);
      if (!item) return;

      const ok = confirm(
        `Точно отменить бронь #${bookingId}?\n\n` +
        `${item.unit_title}\n${item.check_in} → ${item.check_out}`
      );

      if (!ok) return;

      showError("");
      showInfo("");

      const result = await api("/api/v2/admin/webapp/bookings/cancel", {
        booking_id: bookingId
      });

      showInfo(result.message || "Бронь отменена");
      await loadList();
    }

    $("refreshBtn").addEventListener("click", () => {
      loadList().catch(err => showError(err.message || "Ошибка обновления."));
    });

    $("limitSelect").addEventListener("change", () => {
      loadList().catch(err => showError(err.message || "Ошибка загрузки."));
    });

    $("list").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action='cancel']");
      if (!btn) return;

      const bookingId = Number(btn.dataset.id);
      doCancel(bookingId).catch(err => showError(err.message || "Ошибка отмены."));
    });

    loadList().catch(err => showError(err.message || "Не удалось загрузить админку."));
  </script>
</body>
</html>
